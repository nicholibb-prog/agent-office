<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Desk overlay</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../features/workers/screenview.css" />
  </head>
  <body>
    <div class="backdrop">
      <div class="modal desk-screen" role="dialog" aria-label="Byte's desktop">
        <header>
          <h2>Byte's desktop</h2>
          <button class="btn close" type="button" aria-label="Close" title="Close (Esc)">✕</button>
        </header>
        <div class="desk-screen-stage"><canvas id="screen" width="1600" height="900"></canvas></div>
        <footer><span class="grow">Live desk view, same as the laptop. E at the desk still opens the terminal.</span></footer>
      </div>
    </div>
    <script type="module" src="./overlay.ts"></script>
  </body>
</html>
